apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongoex-depl
  labels:
    app: mongoexpress
    tier: db
  namespace: kube-mongo
spec:
  selector:
    matchLabels:
      name: mongo-ex
      app: mongoexpress
  replicas: 2
  template:
    containers:
      - name: mongo-express
        image: mongo-express
        containerPort: 8081
        env:
          - name: ME_CONFIG_MONGODB_ADMINUSERNAME 
            valueFrom:
              secretKeyRef:
                name: mongo-secret
                key: mongo-root-username
          - name: ME_CONFIG_MONGODB_ADMINPASSWORD
            valueFrom:
              secretKeyRef:
                name: mongo-secret
                key: mongo-root-password
          - name: ME_CONFIG_MONGODB_SERVER        
            valueFrom:
              configMapKeyRef:
                name: mongodb-config
                key: database_url
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-exp-srvc
  namespace: kube-mongo
spec:
  selector:
    app: mongoexpress
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 31217 