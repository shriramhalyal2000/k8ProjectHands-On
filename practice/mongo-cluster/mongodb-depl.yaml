apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-depl
  labels:
    app: mongodb
    tier: database
  namespace: kube-mongo
spec:
  seelector:
    matchLabels:
      app: mongodb
  replacas: 1
  template:
    metadata: #doesnot need name of pod because they inherit deployment name
      app: mongodb
    spec:
      containers:
        - name: mongoContainer
          image: mongo
          port:
            - containePort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  value: monog-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monog-secret
                  key: mongo-root-password
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-Service
  namspace: kube-mongo
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017