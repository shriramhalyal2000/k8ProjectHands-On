apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-depl
  labels:
    app: mongodb
    tier: database
  namespace: kube-mongo
spec:
  seelector:
    matchLabels:
      app: mongodb
  replacas: 1
  template:
    metadata: #doesnot need name of pod because they inherit deployment name
      app: mongodb
    spec:
      containers:
        - name: mongoContainer
          image: mongo
          port:
            - containePort: 27017
              
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-Service
spec:
  type: NodePort
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      NodePort: 31700